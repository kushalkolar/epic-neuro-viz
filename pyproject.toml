# ===== Project info

[project]
#dynamic = ["version"]
version = "0.0.1"
name = "opviz"
description = "Next-gen Visualization System for Optical Physiology"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kushal Kolar" }, { name = "Amol Pasarkar" }]

keywords = [
    "visualization",
    "science",
    "interactive",
    "neuroscience",
    "calcium imaging",
    "optical physiology",
    "pygfx",
    "webgpu",
    "wgpu",
    "vulkan",
    "gpu",
]

requires-python = ">= 3.11"
dependencies = [
    "numpy>=1.23.0",
#    "fastplotlib[imgui]==0.6.1",
#    "joblib",
#    "masknmf-toolbox",
    # (this comment keeps this list multiline in VSCode)
]


[project.urls]
Homepage = ""
Documentation = ""
Repository = ""

# ===== Building

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

